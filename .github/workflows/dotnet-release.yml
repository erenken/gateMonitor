name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/pr-build-test.yml

  version:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.8.2'
    - id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
      with:
        configFilePath: GitVersion.yml

  deploy-dotnet:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore
      run: dotnet restore dotnet/myNOC.Remootio/myNOC.Remootio.csproj -warnaserror
    - name: Pack NuGet
      env:
        PACKAGE_VERSION: ${{ needs.version.outputs.semVer }}
      run: dotnet pack dotnet/myNOC.Remootio/myNOC.Remootio.csproj --configuration Release --no-restore --include-symbols --output .pack -p:PackageVersion="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -warnaserror
    - name: Verify SourceLink symbol package
      run: |
        dotnet tool install sourcelink --version 3.1.1 --tool-path .tools
        unzip -q .pack/*.snupkg -d .pack/symbols
        .tools/sourcelink test .pack/symbols/lib/net8.0/myNOC.Remootio.pdb
        .tools/sourcelink test .pack/symbols/lib/net10.0/myNOC.Remootio.pdb
    - name: Authenticate to NuGet with OIDC
      id: nuget-login
      uses: NuGet/login@v1.2.0
      with:
        user: erenken
    - name: Publish NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ".pack/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  deploy-angular:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: angular
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '26'
        registry-url: https://registry.npmjs.org/
        cache: npm
        cache-dependency-path: angular/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Set library version
      env:
        PACKAGE_VERSION: ${{ needs.version.outputs.semVer }}
      run: npm run versionService
    - name: Build Angular library
      run: npm run buildService
    - name: Verify npm package version and contents
      env:
        PACKAGE_VERSION: ${{ needs.version.outputs.semVer }}
      run: |
        npm run verifyServiceVersion
        npm pack ./dist/remootio-angular --dry-run
    - name: Setup npm with trusted publishing support
      run: npm install --global npm@12.2.0
    - name: Publish npm with OIDC
      run: npm publish ./dist/remootio-angular --access public --provenance

  tag:
    needs: [version, deploy-dotnet, deploy-angular]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create GitHub Release and Tag
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: v${{ needs.version.outputs.semVer }}
        name: v${{ needs.version.outputs.semVer }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        prerelease: ${{ needs.version.outputs.preReleaseLabel != '' }}

