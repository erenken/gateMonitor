name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      nuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v3
      with:
        useConfigFile: true

    - name: Echo version
      run: echo "Build version ${{ steps.gitversion.outputs.nuGetVersion }}"

  build-dotnet:
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Restore
      run: dotnet restore dotnet/GateMonitor.slnx

    - name: Build
      run: dotnet build dotnet/GateMonitor.slnx --no-restore

    - name: Test
      run: dotnet test dotnet/GateMonitor.slnx --no-restore --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"

    - name: Test Pack nuget
      run: |
        dotnet pack dotnet/myNOC.Remootio/myNOC.Remootio.csproj --no-build --no-restore --include-symbols --verbosity normal --configuration Debug -p:PackageVersion="${{ needs.version.outputs.nuGetVersion }}"

  build-angular:
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci
      working-directory: angular

    - name: Install library dependencies
      run: npm install
      working-directory: angular

    - name: Set library version
      run: npm version ${{ needs.version.outputs.nuGetVersion }} --no-git-tag-version --allow-same-version
      working-directory: angular/projects/remootio-angular

    - name: Build Angular library
      run: npm run buildService
      working-directory: angular
